[build-system]
requires = ["scikit-build-core>=0.10,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "salmonpy"
version = "0.1.0a4"
description = "SALMON material response, FDTD orchestration and optical workflow tools"
readme = "salmonpy/README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23.5"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
ase = ["ase>=3.26,<4", "f90nml>=1.4,<2"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.source-dir = "packaging/ld"
wheel.packages = []
sdist.include = ["README.md", "AGENTS.md", "salmonpy/**", "packaging/ld/**", "tools/check_forbidden_eigensolvers.py", "tools/repair_ld_wheel.py", "tools/test_installed_ld.py", "native/**", "runtime/**", "tools/prepare_salmon_runtime.py", "tools/test_runtime_preparation.py", "tests/native/**", "LICENSE", "NOTICE", "LICENSE.THIRD-PARTY"]
sdist.exclude = ["src/**", "samples/**", "platforms/**", "cmakefiles/**", "testsuites/**", "utility/**", "gnu_makefiles/**", "upstream-salmon/**", "salmonpy/_native/**", "**/__pycache__/**", "**/*.pyc", "dist/**", "wheelhouse/**"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
archs = ["native"]
test-extras = ["ase", "plot"]
test-command = "python {project}/tools/test_installed_ld.py {project}"
repair-wheel-command = "python {project}/tools/repair_ld_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-gfortran openblas-devel"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
