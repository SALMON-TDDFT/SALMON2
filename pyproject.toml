[build-system]
requires = ["scikit-build-core>=0.10,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "salmonpy"
version = "0.1.0a7"
description = "SALMON material response, FDTD orchestration and optical workflow tools"
readme = "salmonpy/README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23.5"]

[project.optional-dependencies]
fit = ["scipy>=1.10,<2"]
metadata = ["f90nml>=1.4,<2"]
mpi = ["mpi4py>=4,<5"]
plot = ["matplotlib>=3.6"]
ase = ["ase>=3.26,<4", "f90nml>=1.4,<2"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.source-dir = "packaging/ld"
wheel.packages = []
sdist.include = ["tools/test_outer_native_performance_mpi.py","tools/test_outer_performance_mpi.py","tools/test_worker_tddft_performance.py","tools/test_shared_fast_hse_performance_mpi.py","tools/test_fast_hse_performance_mpi.py","tools/test_shared_tddft_performance_mpi.py","tools/test_tddft_performance_mpi.py","tools/fit_optical_materials.py","tools/test_io_ownership.py","tools/test_timer_context.py","docs/plans/2026-11-20-scf-declared-source-migration.md","tools/generate_scf_disk_io.py","tools/test_scf_disk_restart.py","tools/test_symmetry_force_units.py","tools/test_scf_live_resume_mpi.py","tools/test_scf_progress.py","tools/test_portable_retained_gs_mpi.py","tools/test_memory_gs_mpi.py","tools/test_retained_gs_archive_mpi.py","tools/test_retained_gs_mpi.py","tools/test_standard_gs_models.py","tools/test_heterogeneous_tddft_mpi.py","tools/test_parser_ownership.py","tools/test_model_input_ownership.py", "tools/test_standard_checkpoint_finite_mpi.py","tools/test_python_shared_tddft_mpi.py","README.md", "AGENTS.md", "salmonpy/**", "packaging/ld/**", "tools/check_forbidden_eigensolvers.py", "tools/repair_ld_wheel.py", "tools/test_installed_ld.py", "native/**", "runtime/sources/**", "runtime/source-trees/**", "runtime/*.json", "runtime/*.md", "runtime/source-history/**/*.json", "runtime/source-history/**/*.md", "tools/prepare_salmon_runtime.py", "tools/runtime_sources.py", "tools/prepare_rt_step_config.py", "tools/prepare_hse_rt_state.py", "tools/test_hse_rt_state.py", "tools/test_hse_low_gradient.py", "tools/test_fast_hse_low_gradient_mpi.py", "tools/test_hse_explicit_state.py", "tools/test_pp_grid_config.py", "tools/test_kpoint_config.py", "tools/test_pp_input_config.py", "tools/test_xc_input_config.py", "tools/test_pre_scf_state.py", "tools/test_pre_scf_runtime.py", "tools/test_gs_lifecycle.py", "tools/test_gs_occupation_runtime.py", "tools/test_occupation_inputs.py", "tools/test_cell_config.py", "tools/test_grid_config.py", "tools/test_owned_workspaces.py", "tools/test_tddft_contexts.py", "tools/test_native_tddft_admission_mpi.py", "tools/test_tddft_deep_recovery_mpi.py", "tools/test_fast_hse_deep_recovery_mpi.py", "tools/test_eh_deep_recovery_mpi.py", "tools/test_native_protected_step_mpi.py", "tools/test_native_step_admission_mpi.py", "tools/test_mixed_scaling.py", "tools/test_hse_rt_state_runtime.py", "tools/test_rt_step_config.py", "tools/test_rt_step_config_runtime.py", "tools/test_runtime_preparation.py", "tools/package_salmon_runtime.py", "tools/build_parallel_bridge.py", "tools/build_embedded_tddft.py", "tools/build_gs_restart_converter.py", "tools/test_gs_gamma_export_runtime.py", "tools/test_gs_multik_runtime.py", "tools/test_gs_multik_checkpoints.py", "tests/native/**", "LICENSE", "NOTICE", "LICENSE.THIRD-PARTY"]
sdist.exclude = ["runtime/source-history/**/*.tar.gz", "src/**", "samples/**", "platforms/**", "cmakefiles/**", "testsuites/**", "utility/**", "gnu_makefiles/**", "upstream-salmon/**", "salmonpy/_native/**", "**/__pycache__/**", "**/*.pyc", "dist/**", "wheelhouse/**"]

[tool.cibuildwheel]
# Test released binary dependencies; never compile NumPy/SciPy accidentally.
environment = { PIP_ONLY_BINARY = "numpy,scipy,matplotlib" }
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
archs = ["native"]
test-extras = ["ase", "plot"]
test-command = "python {project}/tools/test_installed_ld.py {project}"
repair-wheel-command = "python {project}/tools/repair_ld_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-gfortran openblas-devel"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
