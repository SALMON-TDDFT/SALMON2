[build-system]
requires = ["scikit-build-core>=0.10,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "salmonpy"
version = "0.1.0a5"
description = "SALMON material response, FDTD orchestration and optical workflow tools"
readme = "salmonpy/README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23.5"]

[project.optional-dependencies]
mpi = ["mpi4py>=4,<5"]
plot = ["matplotlib>=3.6"]
ase = ["ase>=3.26,<4", "f90nml>=1.4,<2"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.source-dir = "packaging/ld"
wheel.packages = []
sdist.include = ["README.md", "AGENTS.md", "salmonpy/**", "packaging/ld/**", "tools/check_forbidden_eigensolvers.py", "tools/repair_ld_wheel.py", "tools/test_installed_ld.py", "native/**", "runtime/**", "tools/prepare_salmon_runtime.py", "tools/runtime_sources.py", "tools/prepare_rt_step_config.py", "tools/prepare_hse_rt_state.py", "tools/test_hse_rt_state.py", "tools/test_hse_explicit_state.py", "tools/test_pp_grid_config.py", "tools/test_kpoint_config.py", "tools/test_pp_input_config.py", "tools/test_xc_input_config.py", "tools/test_pre_scf_state.py", "tools/test_pre_scf_runtime.py", "tools/test_gs_lifecycle.py", "tools/test_gs_occupation_runtime.py", "tools/test_occupation_inputs.py", "tools/test_cell_config.py", "tools/test_grid_config.py", "tools/test_owned_workspaces.py", "tools/test_tddft_contexts.py", "tools/test_hse_rt_state_runtime.py", "tools/test_rt_step_config.py", "tools/test_rt_step_config_runtime.py", "tools/test_runtime_preparation.py", "tools/package_salmon_runtime.py", "tools/build_parallel_bridge.py", "tools/build_embedded_tddft.py", "tools/build_gs_restart_converter.py", "tools/test_gs_gamma_export_runtime.py", "tools/test_gs_multik_runtime.py", "tools/test_gs_multik_checkpoints.py", "tests/native/**", "LICENSE", "NOTICE", "LICENSE.THIRD-PARTY"]
sdist.exclude = ["src/**", "samples/**", "platforms/**", "cmakefiles/**", "testsuites/**", "utility/**", "gnu_makefiles/**", "upstream-salmon/**", "salmonpy/_native/**", "**/__pycache__/**", "**/*.pyc", "dist/**", "wheelhouse/**"]

[tool.cibuildwheel]
# Test released binary dependencies; never compile NumPy/SciPy accidentally.
environment = { PIP_ONLY_BINARY = "numpy,scipy,matplotlib" }
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
archs = ["native"]
test-extras = ["ase", "plot"]
test-command = "python {project}/tools/test_installed_ld.py {project}"
repair-wheel-command = "python {project}/tools/repair_ld_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-gfortran openblas-devel"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
