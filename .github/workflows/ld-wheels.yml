name: LD wheels
on:
  workflow_dispatch:
  push:
    paths: &wheel_paths ['.gitattributes', 'salmonpy/**', 'packaging/ld/**', 'pyproject.toml', 'tools/**', 'native/**', 'runtime/**', '.github/workflows/**']
  pull_request:
    paths: *wheel_paths
concurrency:
  # Replace obsolete automatic checks, never cancel an explicit manual campaign.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  wheels:
    needs: [sdist]
    # Ordinary pushes keep one Linux installed-wheel suite. PR/manual runs
    # additionally build/test every platform from the same checked sdist.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the checked source distribution
        uses: actions/download-artifact@v4
        with:
          name: ld-sdist
          path: ${{ runner.temp }}/sdist
      - name: Windows Fortran toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-openblas
          path-type: inherit
      - name: Export Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          "FC=${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/gfortran.exe" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=${{ steps.msys2.outputs.msys2-location }}/ucrt64" >> $env:GITHUB_ENV
      - name: macOS Fortran toolchain
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "FC=$(brew --prefix)/bin/gfortran" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
      - name: Build, bundle runtimes, install and test
        uses: pypa/cibuildwheel@v3.4.0
        with:
          package-dir: ${{ runner.temp }}/sdist/${{ needs.sdist.outputs.archive }}
        env:
          CIBW_ENVIRONMENT_PASS_LINUX: FC
      - name: Verify without optional dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/no-extras"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/no-extras/Scripts/python.exe"; else py="$RUNNER_TEMP/no-extras/bin/python"; fi
          "$py" -m pip install numpy
          "$py" -m pip install --no-deps --no-index --find-links wheelhouse salmonpy
          cd "$RUNNER_TEMP"
          "$py" "$GITHUB_WORKSPACE/tools/test_installed_ld.py" "$GITHUB_WORKSPACE" --suite core
      - uses: actions/upload-artifact@v4
        with:
          name: ld-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  sdist:
    outputs:
      archive: ${{ steps.archive.outputs.name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable starter input checkout
        run: python tools/test_si_intro_checkout.py
      - run: python -m pip install build PyYAML
      - name: Validate CI coverage and deduplication policy
        run: python tools/test_ci_configuration.py
      - run: python tools/test_ld_packaging.py
      - run: sudo apt-get update && sudo apt-get install -y gfortran libopenblas-dev
      - run: python -m build
      - name: Record shared sdist filename
        id: archive
        shell: bash
        run: |
          archive=(dist/*.tar.gz)
          test "${#archive[@]}" -eq 1
          test -f "${archive[0]}"
          echo "name=$(basename "${archive[0]}")" >> "$GITHUB_OUTPUT"
      - name: Verify source-built wheel before repair
        shell: bash
        run: |
          python tools/test_wheel_native_hash.py dist/*.whl
          python -m pip install dist/*.whl
          python -I tools/test_installed_ld.py "$GITHUB_WORKSPACE" --suite "${{ github.event_name == 'push' && 'full' || 'core' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ld-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
