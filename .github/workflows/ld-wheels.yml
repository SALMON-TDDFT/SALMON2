name: LD wheels
on:
  workflow_dispatch:
  push:
    paths: ['salmonpy/**', 'packaging/ld/**', 'pyproject.toml', 'tools/**', 'src/maxwell/lorentz_drude.f90', 'src/ssbe/**', '.github/workflows/ld-wheels.yml']
  pull_request:
    paths: ['salmonpy/**', 'packaging/ld/**', 'pyproject.toml', 'tools/**', 'src/maxwell/lorentz_drude.f90', 'src/ssbe/**', '.github/workflows/ld-wheels.yml']
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows Fortran toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-openblas
          path-type: inherit
      - name: Export Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          "FC=${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin/gfortran.exe" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
      - name: macOS Fortran toolchain
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "FC=$(brew --prefix)/bin/gfortran" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
      - name: Build, bundle runtimes, install and test
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ENVIRONMENT_PASS_LINUX: FC
      - uses: actions/upload-artifact@v4
        with:
          name: ld-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python tools/test_ld_packaging.py
      - run: sudo apt-get update && sudo apt-get install -y gfortran libopenblas-dev
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: ld-sdist
          path: dist/*.tar.gz
