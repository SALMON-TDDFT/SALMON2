name: TDDFT native worker
on:
  workflow_dispatch:
  push:
    paths: ['salmonpy/**', 'src/rt/**', 'src/io/inputoutput.f90', 'tools/test_tddft_entrypoint.py', '.github/workflows/tddft-worker.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran libopenblas-dev
      - run: python -m pip install numpy
      - name: Prepare pinned pre-worker baseline
        run: |
          mkdir "$RUNNER_TEMP/baseline"
          git archive f419cb79aa16e42664c3f4a76164090e44f9593a | tar -x -C "$RUNNER_TEMP/baseline"
      - name: Build and audit both executables
        shell: bash
        run: |
          for variant in baseline current; do
            if [ "$variant" = baseline ]; then source_dir="$RUNNER_TEMP/baseline"; else source_dir="$GITHUB_WORKSPACE"; fi
            python tools/check_forbidden_eigensolvers.py --source-root "$source_dir/src"
            cmake -S "$source_dir" -B "$RUNNER_TEMP/build-$variant" -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_C_COMPILER=gcc -DOPENMP_FLAGS=-fopenmp -DCMAKE_BUILD_TYPE=Release '-DCMAKE_Fortran_FLAGS_RELEASE=-O2 -ffree-line-length-none -fallow-argument-mismatch' -DBLA_VENDOR=OpenBLAS
            cmake --build "$RUNNER_TEMP/build-$variant" --target salmon -j 2
            python tools/check_forbidden_eigensolvers.py --object-tree "$RUNNER_TEMP/build-$variant/src"
          done
      - name: Compare ordinary and interactive native TDDFT
        env:
          PYTHONPATH: .
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/test_tddft_entrypoint.py "$RUNNER_TEMP/build-baseline/salmon" "$RUNNER_TEMP/build-current/salmon" "$RUNNER_TEMP/tddft-regression"
          SALMONPY_TEST_PC=y python tools/test_tddft_entrypoint.py "$RUNNER_TEMP/build-baseline/salmon" "$RUNNER_TEMP/build-current/salmon" "$RUNNER_TEMP/tddft-predictor"
