name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain (gfortran, OpenMPI, LAPACK)
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran openmpi-bin libopenmpi-dev liblapack-dev libblas-dev cmake python3

      - name: Clean and Configure SALMON
        run: |
          # Eliminate stale tracking or Docker cache directories causing conflicts
          rm -rf build CMakeCache.txt CMakeFiles/
          
          mkdir -p build
          cd build
          
          # Use official SALMON documentation build convention
          python3 ../configure.py \
            CC=mpicc \
            FC=mpif90 \
            --prefix=../

      - name: Build SALMON
        run: |
          cd build
          make -j$(nproc)

      - name: Install SALMON
        run: |
          cd build
          make install

      - name: Verify Build Execution
        run: |
          # Verify binary generation in installation prefix bin folder
          if [ -f "./bin/salmon" ]; then
            echo "SALMON binary successfully installed!"
            # Execution check (may exit non-zero without input file; verify path presence)
            ls -la ./bin/salmon
          else
            echo "Error: SALMON binary compilation/installation failed."
            exit 1
          fi
